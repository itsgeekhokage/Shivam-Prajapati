<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ecdc4"/>
      <stop offset="100%" stop-color="#44a8a1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.25" r="0.6">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="#161622"/>
  <rect width="1200" height="750" fill="url(#glow)"/>
  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="750"/>
    <line x1="400" y1="0" x2="400" y2="750"/>
    <line x1="600" y1="0" x2="600" y2="750"/>
    <line x1="800" y1="0" x2="800" y2="750"/>
    <line x1="1000" y1="0" x2="1000" y2="750"/>
  </g>
  <g font-family="'Courier New', monospace" font-size="30" font-weight="bold">
    <text x="730" y="300" fill="#8b8b9e"><tspan fill="#ff6b6b">def</tspan> <tspan fill="#4ecdc4">review</tspan>(pr):</text>
    <text x="770" y="350" fill="#b9b9c9">issues = model(pr.diff)</text>
    <text x="770" y="400" fill="#b9b9c9"><tspan fill="#ff8e53">return</tspan> score, fixes</text>
  </g>
  <g>
    <circle cx="1050" cy="440" r="30" fill="url(#teal)"/>
    <path d="M1037 440 l 9 10 l 18 -20" stroke="#161622" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="90" y="330" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-2">Code Review AI</text>
  <text x="92" y="390" font-family="'Courier New', monospace" font-size="26" fill="#8b8b9e">TRANSFORMERS &#183; NLP &#183; FASTAPI</text>
  <rect x="92" y="430" width="220" height="4" rx="2" fill="url(#accent)"/>
  <text x="92" y="485" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#b9b9c9">Automated PR review — quality, efficiency, security</text>
  <text x="92" y="620" font-family="'Courier New', monospace" font-size="18" fill="#5f5f74">AI SYSTEMS</text>
